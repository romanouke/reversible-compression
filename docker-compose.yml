name: reversible-compression

services:
  backend:
    build:
      context: ./backend
    environment:
      REVCOMP_MAX_UPLOAD_MB: ${REVCOMP_MAX_UPLOAD_MB:-500}
      REVCOMP_MAX_MAP_MB: ${REVCOMP_MAX_MAP_MB:-10}
      REVCOMP_JOB_TTL_HOURS: 24
      REVCOMP_MAX_CONCURRENT_JOBS: 1
      REVCOMP_DEFAULT_MODE: stream
      REVCOMP_DEFAULT_CODEC: libx264
      REVCOMP_DEFAULT_PRESET: medium
      REVCOMP_DEFAULT_CRF: 23
      REVCOMP_TUBE_DURATION_SEC: 1.0
      REVCOMP_CORS_ORIGINS: http://localhost:5173
      REVCOMP_LOG_LEVEL: INFO
      REVCOMP_LOG_FORMAT: json
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [app]
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: /api
      VITE_WS_BASE: /api/ws
      VITE_API_TARGET: http://backend:8000
      VITE_MAX_UPLOAD_MB: ${REVCOMP_MAX_UPLOAD_MB:-500}
      VITE_MAX_MAP_MB: ${REVCOMP_MAX_MAP_MB:-10}
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks: [app]
    restart: unless-stopped

networks:
  app:
    driver: bridge

volumes:
  frontend_modules:
